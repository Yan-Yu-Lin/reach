# Reach dashboard/API vhost template (what jason runs, plus hardening).
#
# Not installed automatically. Placeholders:
#   tunnels.example.com   public hostname
#   __WS_SECRET__         WebSocket carrier path secret (never commit it)
#
# Target: nginx 1.24 (Ubuntu 24.04). Verify with `nginx -t` on that version.
#
# Changes compared with the 2026-11-20 jason vhost:
#   - gzip for JS/CSS/JSON/SVG (gzip_types was commented out globally)
#   - /_nuxt/ hashed assets: immutable 1-year cache; index.html: no-cache
#   - limit_req on /api/client/ and /api/admin/login, limit_conn on the
#     carrier route (Opus P0-1 #5, daybreak P1-1 #4)
#   - server_tokens off (Opus P3-6)

# --- http{} context (e.g. /etc/nginx/conf.d/reach-limits.conf) -------------
limit_req_zone  $binary_remote_addr zone=reach_client:10m rate=2r/s;
limit_req_zone  $binary_remote_addr zone=reach_login:1m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=reach_ws_conn:10m;
# --------------------------------------------------------------------------

server {
    # nginx 1.24 (jason) has no "http2 on;" (added in 1.25.1); use the
    # listen parameter, which 1.25+ still accepts with a deprecation warning.
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name tunnels.example.com;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://tunnels.example.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    ssl_certificate     /etc/letsencrypt/live/tunnels.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnels.example.com/privkey.pem;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json text/plain image/svg+xml;

    limit_req_status 429;
    limit_conn_status 429;

    # Client API: register/poll/provision/heartbeat. reachd has its own
    # limits; this is the outer layer. Agents heartbeat every 30-45 s, an
    # installer polls every 3 s, so burst 20 leaves plenty of headroom.
    location /api/client/ {
        limit_req zone=reach_client burst=20 nodelay;
        proxy_pass http://127.0.0.1:9300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 256k;
    }

    location = /api/admin/login {
        limit_req zone=reach_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 16k;
    }

    # Admin SSE event stream (long-lived; must not be buffered or gzipped)
    location = /api/admin/events {
        proxy_pass http://127.0.0.1:9300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header X-Accel-Buffering no;
    }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:9300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /setup.ps1 {
        alias /var/lib/reach/setup.ps1;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /setup.sh {
        alias /var/lib/reach/setup.sh;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # WebSocket SSH carrier. The carrier also enforces this exact prefix
    # when started with REACH_WS_PATH_PREFIX.
    location ^~ /ws/tunnel/__WS_SECRET__/ {
        limit_conn reach_ws_conn 8;
        proxy_pass http://127.0.0.1:9401;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /ws/tunnel/ {
        return 404;
    }

    location /downloads/reach-agent/ {
        alias /var/lib/reach/downloads/reach-agent/;
        default_type application/octet-stream;
    }

    location /downloads/wstunnel/ {
        alias /var/lib/reach/downloads/wstunnel/;
        default_type application/octet-stream;
    }

    # Nuxt hashed build assets never change for a given name.
    location ^~ /_nuxt/ {
        root /opt/reach-dashboard;
        # add_header here replaces the server-level headers, so repeat them.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Dashboard (static SPA). index.html must revalidate so a deploy is seen.
    location / {
        root /opt/reach-dashboard;
        # add_header here replaces the server-level headers, so repeat them.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://tunnels.example.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
