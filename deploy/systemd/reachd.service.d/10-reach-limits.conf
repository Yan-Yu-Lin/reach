# Resource limits for reachd. Installed by scripts/deploy-jason.sh on every
# deploy (daybreak P1-6) as /etc/systemd/system/reachd.service.d/10-reach-limits.conf.
#
# What this is: a ceiling so a resource-exhaustion bug or flood can at worst
# restart reachd (Restart=always), not starve jason's other services.
# What this is NOT: privilege containment. reachd still runs as root; a
# remote-code-execution bug in reachd is still root on jason. Root
# containment needs the privilege split in
# docs/design/2026-11-21-reachd-privilege-split.md. The stricter
# ProtectSystem/capability sandbox stays opt-in in ../reachd.service.
[Service]
MemoryHigh=768M
MemoryMax=1G
TasksMax=256
LimitNOFILE=4096
